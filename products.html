<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品登録</title><link rel="stylesheet" href="style.css"></head><body><header><h1>商品登録・QR発行</h1><a href="register.html">レジ →</a></header><main class="container"><section class="card"><h2>新しい商品</h2><label>商品名<input id="name" placeholder="チョコオールド"></label><label>価格<input id="price" type="number" min="0" placeholder="200"></label><button id="add" class="primary">商品を登録してQRを作る</button></section><section class="card"><h2>登録済み商品</h2><div id="list"></div></section></main><div id="modal" class="modal" hidden><div class="modal-card"><button id="close" class="close">×</button><h2 id="qrname"></h2><div id="qr"></div><p>このQRを商品に貼ってください</p><button id="print" class="primary">QRを印刷</button></div></div><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="crypto.js"></script><script src="products.js"></script></body></html>
