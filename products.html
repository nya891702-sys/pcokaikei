<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR商品発行</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:700px;margin:30px auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:22px;margin-bottom:16px}
h1{text-align:center}label{display:block;font-weight:700;margin:14px 0}input{width:100%;padding:13px;margin-top:6px;border:1px solid #aaa;border-radius:9px;font-size:16px}
button{border:0;border-radius:10px;padding:13px 17px;background:#202124;color:white;font-weight:700;font-size:16px;cursor:pointer}
#qrArea{text-align:center;min-height:30px}#payload{word-break:break-all;background:#f5f5f5;padding:10px;border-radius:8px;font-size:12px;color:#555}
.error{color:#b00020}.ok{color:#18794e}
</style>
</head>
<body>
<main>
<h1>QR商品発行</h1>

<section class="card">
<h2>1. 内容を確定</h2>
<label>商品名<input id="productName" placeholder="チョコオールド"></label>
<label>価格<input id="productPrice" type="number" min="0" inputmode="numeric" placeholder="200"></label>
<button id="createBtn">暗号化してQRを作成</button>
<p id="message"></p>
</section>

<section class="card">
<h2>2. QRコード</h2>
<div id="qrArea">まだ作成されていません。</div>
</section>

<section class="card">
<h2>確認用データ</h2>
<p class="small">QRに入るのは下の「暗号化済み文字列」です。商品名や価格そのものはQRに平文では入りません。</p>
<div id="payload">未作成</div>
</section>
</main>

<!--
  QRライブラリは各自で用意する。
  例: 同じフォルダに qrcode.min.js を置いて、この行を有効化。
-->
<!-- <script src="qrcode.min.js"></script> -->

<script src="crypto.js"></script>
<script src="qr-adapter.js"></script>
<script src="products.js"></script>
</body>
</html>
