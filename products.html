<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品登録・QR作成</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>商品登録・QR作成</h1></header>
<main class="container">
<section class="card">
<h2>商品登録</h2>
<label>商品名<input id="name" placeholder="例：チョコオールド"></label>
<label>価格<input id="price" type="number" min="0" inputmode="numeric" placeholder="200"></label>
<button id="add" class="primary">商品を登録してQRを作成</button>
<p id="message" class="message"></p>
</section>
<section class="card"><h2>登録済み商品</h2><div id="list"></div></section>
</main>
<div id="modal" class="modal" hidden>
<div class="modal-card"><button id="close" class="close">×</button>
<h2 id="qrTitle"></h2><div id="qr"></div>
<p>このQRコードを商品に貼り付けてください。</p>
<button id="print" class="primary">このQRを印刷</button>
</div></div>
<script src="qrcode.min.js"></script><script src="crypto.js"></script><script src="products.js"></script>
</body></html>
