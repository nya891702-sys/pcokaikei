<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPhoneレジ</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>iPhoneレジ</h1><button id="historyBtn">会計履歴</button></header>
<main class="register">
<section class="card">
<h2>QR読み取り</h2>
<div class="camera"><video id="video" autoplay muted playsinline></video><div class="scan-frame"></div></div>
<div class="buttons"><button id="startBtn" class="primary">カメラを起動</button><button id="stopBtn">停止</button></div>
<p id="scanStatus">カメラを起動してください。</p>
</section>
<section class="card">
<h2>お会計</h2><div id="cart">商品がありません。</div>
<div class="total">合計 <span id="total">¥0</span></div>
<button id="payBtn" class="primary big">会計する</button>
<button id="clearBtn">カートを空にする</button>
</section>
</main>
<div id="historyModal" class="modal" hidden><div class="modal-card wide">
<button id="historyClose" class="close">×</button><h2>会計履歴</h2><div id="history"></div>
<button id="historyClear">履歴を全消去</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="crypto.js"></script>
<script src="register.js"></script>
</body></html>
