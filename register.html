<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品登録・QR発行</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="register.css"></head><body><header><a href="index.html">‹</a><span>商品登録・QR発行</span></header><main><section class="card"><h1>商品登録</h1><label>発行開始番号<input id="startNumber" type="number" min="0" step="1" inputmode="numeric" placeholder="001"><small>最初に設定した番号から自動で連番になります。</small></label><label>商品名<input id="productName" placeholder="商品名をここに入力"></label><label>値段<input id="productPrice" type="number" min="0" step="1" inputmode="numeric" placeholder="値段をここに入力"></label><button id="createQR" class="primary full">QRコードを発行</button><p id="registerStatus" class="status"></p></section><section id="result" class="card result hidden"><h2>発行結果</h2><div class="info"><p>商品ID：<b id="resultId"></b></p><p>商品名：<b id="resultName"></b></p><p>値段：<b id="resultPrice"></b>円</p></div><div id="qr" class="qr-box"></div><p id="qrText" class="raw"></p><div class="actions"><button id="saveQR" disabled>画像保存</button><button id="printQR" disabled>印刷</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="common.js"></script></body></html>
