<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR読み取り</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:600px;margin:auto;padding:18px}.camera{position:relative;width:100%;aspect-ratio:1/1;background:#000;border-radius:16px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover}.frame{position:absolute;left:15%;top:15%;width:70%;height:70%;border:3px solid white;border-radius:14px}
button{padding:14px 18px;border:0;border-radius:10px;font-weight:700;margin:8px 4px 8px 0}
#raw{background:#222;border-radius:10px;padding:12px;word-break:break-all;font-size:12px;min-height:50px}
</style>
</head>
<body>
<main>
<h1>QR読み取り</h1>
<div class="camera">
<video id="video" autoplay muted playsinline></video>
<div class="frame"></div>
</div>
<button id="start">カメラ起動</button>
<button id="stop">停止</button>
<p id="status">QRを読み取るだけの画面です。</p>
<h2>読み取ったデータ</h2>
<div id="raw">未読み取り</div>
</main>

<!-- 読み取りライブラリも各自で差し替える -->
<!-- <script src="jsQR.js"></script> -->
<script src="reader-adapter.js"></script>
</body>
</html>
